name: Sync Publications from Google Scholar

# Weekly: pull the publication list from Google Scholar (via SerpAPI),
# regenerate content/publication/ from scratch, commit, and redeploy.
on:
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write # commit regenerated pages
  actions: write # dispatch the deploy workflow

concurrency:
  group: sync-scholar
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Public Google Scholar author id (the `user=` value in your profile URL).
      SCHOLAR_AUTHOR_ID: '91rGZecAAAAJ'
      # Stored as a repository secret (Settings -> Secrets and variables -> Actions).
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "academic>=0.10.0"

      - name: Fetch publications from Google Scholar (new only)
        run: python scripts/scholar_to_bib.py

      - name: Import only new publications (preserve curated pages)
        run: |
          # Add-only: existing pages (with abstracts/images) are left untouched;
          # we import just the entries whose titles aren't already present.
          if [ -s new_publications.bib ]; then
            academic import new_publications.bib content/publications/ --compact --verbose
            echo "Imported new publications."
          else
            echo "No new publications to import."
          fi
          rm -f new_publications.bib

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.bib content/publications
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No publication changes detected."
          else
            git commit -m "chore(publications): sync from Google Scholar"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

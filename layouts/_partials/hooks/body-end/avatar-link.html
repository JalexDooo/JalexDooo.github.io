<style>
  .avatar-experience-link {
    display: inline-block;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
    border-radius: 9999px;
  }
  .avatar-experience-link:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
  }
</style>
<script>
  (function () {
    function wrapAvatar() {
      var avatars = document.querySelectorAll('img[src*="avatar"]');
      avatars.forEach(function (avatar) {
        if (avatar.closest('.avatar-experience-link')) return;
        var link = document.createElement('a');
        link.href = '/experience/';
        link.className = 'avatar-experience-link';
        link.setAttribute('aria-label', 'View my experience');
        avatar.parentNode.insertBefore(link, avatar);
        link.appendChild(avatar);
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', wrapAvatar);
    } else {
      wrapAvatar();
    }
  })();
</script>
